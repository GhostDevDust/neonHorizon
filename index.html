<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Horizon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23090018%27/%3E%3Ccircle cx=%2716%27 cy=%2714%27 r=%278%27 fill=%27%23ffd319%27/%3E%3Crect y=%2720%27 width=%2732%27 height=%272%27 fill=%27%23ff2975%27/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #090018;
    color: #eae4ff;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }

  #ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: linear-gradient(to top, rgba(9,0,24,.92), rgba(9,0,24,0));
    pointer-events: none;
  }
  body.in-vr #ui { display: none; }

  #vrBtn {
    pointer-events: auto;
    font: 700 18px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .22em;
    padding: 14px 34px;
    color: #00f0ff;
    background: rgba(0, 240, 255, .07);
    border: 2px solid #00f0ff;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 18px rgba(0,240,255,.45), inset 0 0 18px rgba(0,240,255,.15);
    transition: background .15s, color .15s;
  }
  #vrBtn:hover:not(:disabled) { background: #00f0ff; color: #090018; }
  #vrBtn:disabled {
    color: #6b5a8f; border-color: #6b5a8f; box-shadow: none;
    cursor: default; background: transparent;
  }

  #note { font-size: 13px; color: #a08cc8; max-width: 46ch; text-align: center; line-height: 1.5; }
  #hint { font-size: 12px; color: #6b5a8f; letter-spacing: .08em; }

  /* Flat-screen aim reference. VR has the controller beam instead. */
  #cross {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    margin: -11px 0 0 -11px; pointer-events: none; opacity: .75;
  }
  #cross::before, #cross::after {
    content: ""; position: absolute; background: #00f0ff;
    box-shadow: 0 0 6px #00f0ff;
  }
  #cross::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
  #cross::after { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
  body.in-vr #cross { display: none; }

  /* Edge chevrons pointing at targets outside the flat-screen view. */
  #cues { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  body.in-vr #cues { display: none; }

  #title {
    position: fixed; top: 22px; left: 0; right: 0; text-align: center;
    font: 700 15px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .5em; text-transform: uppercase;
    color: #ff2975; text-shadow: 0 0 14px rgba(255,41,117,.8);
    pointer-events: none;
  }
  body.in-vr #title { display: none; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="title">Neon Horizon</div>
  <div id="cross"></div>
  <canvas id="cues"></canvas>
  <div id="ui">
    <button id="vrBtn" disabled>Checking headset…</button>
    <div id="note">Put the headset on, then press Enter VR.</div>
    <div id="hint">Trigger = shoot · M = mute · desktop: click to grab the mouse, look anywhere, hold to fire · A/D turn · Esc releases · Xbox pad: right stick + RT (press a button first)</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
